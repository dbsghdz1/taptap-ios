appId: com.nbs.taptap.rnhost
name: Android 네이티브 응답이 늦으면 앱 버전 자리에 로딩을 보이고 응답 뒤 버전을 보인다
---
- launchApp:
    clearState: true
    arguments:
      RNFaultAppInfoDelayMs: 12000
- extendedWaitUntil:
    visible: "settings"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "settings"
- extendedWaitUntil:
    visible:
      id: "setting.appVersion.loading"
    timeout: 60000
- assertNotVisible:
    id: "setting.appVersion.value"
- extendedWaitUntil:
    visible:
      id: "setting.appVersion.value"
    timeout: 20000
- assertNotVisible:
    id: "setting.appVersion.loading"
